name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # No Supabase variables: the build uses the fictional sample data.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  database:
    name: Migrations and SQL permission tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Stand in for Supabase auth/storage
        run: psql -v ON_ERROR_STOP=1 -q -f tests/supabase-stub.sql
      - name: Apply every migration in order
        run: for file in supabase/migrations/*.sql; do echo "Applying $file"; psql -v ON_ERROR_STOP=1 -q -f "$file"; done
      - name: Marketplace workflow and RLS
        run: psql -v ON_ERROR_STOP=1 -q -f tests/marketplace.sql
      - name: Trust fixes
        run: psql -v ON_ERROR_STOP=1 -q -f tests/trust-fixes.sql
      - name: Rate limits and deletion
        run: psql -v ON_ERROR_STOP=1 -q -f tests/abuse-and-deletion.sql
